<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="デジタル御用聞き リダイフの無料相談フォーム。何を頼めばいいか決まっていなくても、困っていることから相談できます。"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"><title>無料相談｜デジタル御用聞き リダイフ</title><link rel="stylesheet" href="../assets/css/styles.css"><script src="../assets/js/site.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../"><span class="brand-mark">R</span><span><strong>リダイフ</strong><small>デジタル御用聞き</small></span></a><a class="text-link" href="../services/">サービスを見る</a></div></header><main><div class="container breadcrumb"><a href="../">トップ</a> / 無料相談</div><section class="page-hero"><div class="container"><p class="eyebrow">FREE CONSULTATION</p><h1>何を頼むか決まって<br>いなくても大丈夫です。</h1><p>「毎回この作業が面倒」「こういうことはできる？」など、いま困っていることを教えてください。</p></div></section><section class="section"><div class="container contact-layout"><aside><div class="contact-note"><h2>相談前に準備は不要です</h2><p>専門用語や仕様書は必要ありません。現在の仕事の流れと、負担に感じていることから整理します。</p><p><strong>対応：</strong>対面またはオンライン</p><p><strong>標準対象：</strong>岡山県内の中小企業・個人事業主</p></div></aside><form class="contact-form" data-contact-form novalidate><fieldset class="field"><legend>何について相談したいですか？<span class="required">必須</span></legend><div class="radio-grid"><label class="radio-option"><input type="radio" name="topic" value="業務効率化" required>業務を効率化したい</label><label class="radio-option"><input type="radio" name="topic" value="顧客案件管理">顧客・案件管理を整理したい</label><label class="radio-option"><input type="radio" name="topic" value="AI活用">AIを仕事に使いたい</label><label class="radio-option"><input type="radio" name="topic" value="LP">LPを作りたい</label><label class="radio-option"><input type="radio" name="topic" value="相談">何を改善できるか相談したい</label><label class="radio-option"><input type="radio" name="topic" value="その他">その他</label></div></fieldset><div class="field"><label for="company">会社名・屋号</label><input id="company" name="company" autocomplete="organization" maxlength="100"></div><div class="field"><label for="name">お名前<span class="required">必須</span></label><input id="name" name="name" autocomplete="name" required maxlength="80"></div><div class="field"><label for="email">メールアドレス<span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254"></div><div class="field"><label for="message">現在困っていること<span class="required">必須</span></label><textarea id="message" name="message" required maxlength="2000" placeholder="例：見積もり後の連絡を忘れることがある／同じ内容をExcelとLINEに何度も入力している"></textarea></div><p class="legal"><a class="text-link" href="../privacy/">プライバシーポリシー</a>をご確認のうえ送信してください。</p><button class="button" type="submit">無料相談を送信する</button><div class="form-status" tabindex="-1" role="status" data-form-status></div></form></div></section></main><footer class="site-footer"><div class="container"><a class="brand brand-footer" href="../"><span class="brand-mark">R</span><span><strong>リダイフ</strong><small>デジタル御用聞き</small></span></a></div></footer></body></html>
